apiVersion: apps/v1
kind: Deployment
metadata:
  name: spatial-frontend-deployment
  labels:
    app: spatial-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spatial-frontend
  template:
    metadata:
      labels:
        app: spatial-frontend
    spec:
      containers:
      - name: nginx
        image: spatial-frontend:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: spatial-frontend-service
  labels:
    app: spatial-frontend
spec:
  type: NodePort
  selector:
    app: spatial-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30000
    protocol: TCP
