apiVersion: apps/v1
kind: Deployment
metadata:
  name: spatial-engine-deployment
  labels:
    app: spatial-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spatial-engine
  template:
    metadata:
      labels:
        app: spatial-engine
    spec:
      containers:
      - name: spatial-engine
        image: spatial-engine:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "150m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        env:
        - name: PORT
          value: "8080"
